<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Registration - Football Turf Management</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <header class="navbar">
    <div class="nav-container"></div>
  </header>

  <main class="main-content">
    <div class="auth-box">
      <div class="auth-header">
        <h2>Customer Registration</h2>
        <p>Create an account to book and manage football turf slots</p>
      </div>

      <form id="register-form">
        <div class="form-group">
          <label for="reg-name">Full Name</label>
          <input type="text" id="reg-name" class="form-control" placeholder="e.g. John Doe" required autocomplete="name">
        </div>

        <div class="form-group">
          <label for="reg-email">Email Address</label>
          <input type="email" id="reg-email" class="form-control" placeholder="name@example.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <label for="reg-phone">Phone Number</label>
          <input type="tel" id="reg-phone" class="form-control" placeholder="10-digit mobile number" required pattern="[0-9]{10}" autocomplete="tel">
          <div class="form-text">Used for booking SMS & confirmation records.</div>
        </div>

        <div class="form-group">
          <label for="reg-password">Password</label>
          <input type="password" id="reg-password" class="form-control" placeholder="Minimum 6 characters" required minlength="6" autocomplete="new-password">
        </div>

        <div class="form-group">
          <label for="reg-confirm-password">Confirm Password</label>
          <input type="password" id="reg-confirm-password" class="form-control" placeholder="Re-enter password" required minlength="6" autocomplete="new-password">
        </div>

        <button type="submit" class="btn btn-primary btn-full" id="btn-reg-submit">
          Create Account
        </button>
      </form>

      <div style="text-align: center; margin-top: 20px; font-size: 0.9rem; color: var(--text-muted);">
        Already registered? <a href="/login.html" style="color: var(--primary); font-weight: 600;">Sign in here</a>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="footer-bottom">
      &copy; 2026 Football Turf Management System. College DBMS Mini-Project.
    </div>
  </footer>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
