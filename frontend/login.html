<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Football Turf Management</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <header class="navbar">
    <div class="nav-container"></div>
  </header>

  <main class="main-content">
    <div class="auth-box">
      <div class="auth-header">
        <h2>Sign In to Account</h2>
        <p>Select your account role to continue</p>
      </div>

      <!-- Role Selector Toggle -->
      <div class="role-toggle">
        <button type="button" class="role-btn active" id="btn-role-customer" onclick="setRole('customer')">⚽ Customer</button>
        <button type="button" class="role-btn" id="btn-role-manager" onclick="setRole('manager')">🛡️ Turf Manager</button>
      </div>

      <form id="login-form">
        <input type="hidden" id="login-role" value="customer">

        <div class="form-group">
          <label for="login-email">Email Address</label>
          <input type="email" id="login-email" class="form-control" placeholder="name@example.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" class="form-control" placeholder="Enter your password" required autocomplete="current-password">
        </div>

        <button type="submit" class="btn btn-primary btn-full" id="btn-login-submit">
          Sign In as Customer
        </button>
      </form>

      <!-- Quick Demo Credentials Fill -->
      <div style="margin-top: 24px; padding-top: 18px; border-top: 1px solid var(--border-color);">
        <p style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 8px; font-weight: 600;">
          🎓 DEMO / EXAMINER CREDENTIALS:
        </p>
        <div style="display: flex; gap: 8px; flex-wrap: wrap;">
          <button type="button" class="btn btn-outline-dark btn-sm" onclick="fillCredentials('gavril@example.com', 'customer123', 'customer')">
            Fill Customer (Gavril)
          </button>
          <button type="button" class="btn btn-outline-dark btn-sm" onclick="fillCredentials('manager@turf.com', 'manager123', 'manager')">
            Fill Manager (Admin)
          </button>
        </div>
      </div>

      <div style="text-align: center; margin-top: 20px; font-size: 0.9rem; color: var(--text-muted);">
        Don't have a customer account? <a href="/register.html" style="color: var(--primary); font-weight: 600;">Register here</a>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="footer-bottom">
      &copy; 2026 Football Turf Management System. College DBMS Mini-Project.
    </div>
  </footer>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
