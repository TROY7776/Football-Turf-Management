<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <!-- Sky - day time -->
  <rect width="800" height="450" fill="#1a3a1a"/>
  <!-- Compact turf -->
  <rect x="0" y="180" width="800" height="270" fill="#217a35"/>
  <!-- Stripes -->
  <rect x="0" y="180" width="90" height="270" fill="#269040"/>
  <rect x="90" y="180" width="90" height="270" fill="#217a35"/>
  <rect x="180" y="180" width="90" height="270" fill="#269040"/>
  <rect x="270" y="180" width="90" height="270" fill="#217a35"/>
  <rect x="360" y="180" width="90" height="270" fill="#269040"/>
  <rect x="450" y="180" width="90" height="270" fill="#217a35"/>
  <rect x="540" y="180" width="90" height="270" fill="#269040"/>
  <rect x="630" y="180" width="90" height="270" fill="#217a35"/>
  <rect x="720" y="180" width="80" height="270" fill="#269040"/>
  <!-- Netting perimeter suggestion -->
  <rect x="20" y="175" width="760" height="4" fill="#c0c0c0" rx="2"/>
  <line x1="20" y1="175" x2="20" y2="440" stroke="#c0c0c0" stroke-width="3"/>
  <line x1="780" y1="175" x2="780" y2="440" stroke="#c0c0c0" stroke-width="3"/>
  <!-- Pitch markings -->
  <rect x="40" y="195" width="720" height="230" fill="none" stroke="white" stroke-width="2.5"/>
  <line x1="400" y1="195" x2="400" y2="425" stroke="white" stroke-width="2"/>
  <circle cx="400" cy="310" r="55" fill="none" stroke="white" stroke-width="2"/>
  <circle cx="400" cy="310" r="4" fill="white"/>
  <!-- Penalty areas (smaller) -->
  <rect x="40" y="258" width="110" height="100" fill="none" stroke="white" stroke-width="2"/>
  <rect x="650" y="258" width="110" height="100" fill="none" stroke="white" stroke-width="2"/>
  <!-- Goals -->
  <rect x="22" y="280" width="6" height="60" fill="white"/>
  <rect x="16" y="278" width="28" height="4" fill="white"/>
  <rect x="772" y="280" width="6" height="60" fill="white"/>
  <rect x="756" y="278" width="28" height="4" fill="white"/>
  <!-- 2 Floodlights -->
  <rect x="150" y="20" width="8" height="160" fill="#9ba8b5"/>
  <rect x="132" y="13" width="44" height="11" fill="#ffe066" rx="2"/>
  <ellipse cx="154" cy="19" rx="30" ry="12" fill="#fffde0" opacity="0.3"/>
  <rect x="642" y="20" width="8" height="160" fill="#9ba8b5"/>
  <rect x="624" y="13" width="44" height="11" fill="#ffe066" rx="2"/>
  <ellipse cx="646" cy="19" rx="30" ry="12" fill="#fffde0" opacity="0.3"/>
  <!-- Simple stand -->
  <rect x="0" y="120" width="800" height="62" fill="#122412"/>
  <line x1="0" y1="130" x2="800" y2="130" stroke="#1e3a1e" stroke-width="1.5"/>
  <line x1="0" y1="145" x2="800" y2="145" stroke="#1e3a1e" stroke-width="1.5"/>
  <line x1="0" y1="160" x2="800" y2="160" stroke="#1e3a1e" stroke-width="1.5"/>
  <line x1="0" y1="174" x2="800" y2="174" stroke="#1e3a1e" stroke-width="1.5"/>
  <!-- Label -->
  <text x="400" y="82" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="white" text-anchor="middle">KICKOFF SPORTS GROUND</text>
  <text x="400" y="104" font-family="Arial, sans-serif" font-size="13" fill="#22c55e" text-anchor="middle">ALL-WEATHER · 5-A-SIDE · SECURE PARKING</text>
</svg>
